name: dsh

services:
  dsh:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dsh
    restart: unless-stopped

    ports:
      - "3080:3080"

    environment:
      NODE_ENV: production
      GIT_AUTHOR_NAME: jolafigue
      GIT_AUTHOR_EMAIL: jonathan.houze+bot@gmail.com
      GIT_COMMITTER_NAME: jolafigue
      GIT_COMMITTER_EMAIL: jonathan.houze+bot@gmail.com
      JJ_USER_NAME: jolafigue
      JJ_USER_EMAIL: jonathan.houze+bot@gmail.com

    secrets:
      - source: dsh_github_token
        target: /run/secrets/dsh_github_token

    volumes:
      - dsh-home:/home/dsh
      - /Users/jonathanhouze/.agents:/home/dsh/.agents:rw

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3080/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  dsh-home:

secrets:
  dsh_github_token:
    file: ./secrets/github-token