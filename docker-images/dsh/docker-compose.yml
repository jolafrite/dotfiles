name: dsh

services:
  dsh:
    image: dsh-dsh:latest
    container_name: dsh
    restart: unless-stopped

    ports:
      - "3080:3080"
      - "20128:20128"

    environment:
      NODE_ENV: production
      GIT_AUTHOR_NAME: jolafigue
      GIT_AUTHOR_EMAIL: jonathan.houze+bot@gmail.com
      GIT_COMMITTER_NAME: jolafigue
      GIT_COMMITTER_EMAIL: jonathan.houze+bot@gmail.com
      JJ_USER_NAME: jolafigue
      JJ_USER_EMAIL: jonathan.houze+bot@gmail.com
      NODE_OPTIONS: --max-old-space-size=8192
      ZENMUX_API_KEY: sk-97492eca44beceb7-9uoe52-b0026f0e
      CLINE_API_KEY: sk-97492eca44beceb7-9uoe52-b0026f0e
    deploy:
      resources:
        limits:
          memory: 10G

    secrets:
      - source: dsh_github_token
        target: /run/secrets/dsh_github_token

    volumes:
      - dsh-home:/home/dsh
      - /Users/jonathanhouze/.agents:/home/dsh/.agents:rw

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3080/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  headroom:
    image: ghcr.io/headroomlabs-ai/headroom:latest
    container_name: headroom
    restart: unless-stopped
    command: --host 0.0.0.0 --port 8787 --openai-api-url http://dsh:20128 --openai-extra-headers '{"x-9r-peer-token":"headroom","x-9r-real-ip":"127.0.0.1"}'
    ports:
      - "8787:8787"
    environment:
      HEADROOM_OUTPUT_SHAPER: "1"
      HEADROOM_BEACON: "off"
      HEADROOM_MODE: "cache"
      OPENAI_API_KEY: "dummy"
      HEADROOM_MEMORY_DB_PATH: "/home/headroom/.headroom/memory.db"
    volumes:
      - dsh-home:/home/headroom/.headroom
    depends_on:
      - dsh

volumes:
  dsh-home:

secrets:
  dsh_github_token:
    file: ./secrets/github-token